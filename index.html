<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7a1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>지금은 전쟁중 — 깨어 하나되자!</title>
<style>
  :root{
    --bg:#f6f1ea;
    --card:#ffffff;
    --ink:#1d1a17;
    --ink-2:#5d554c;
    --line:#e2d9cd;
    --accent:#7a1220;
    --accent-soft:#f6e6e6;
    --gold:#a9762c;
    --ok:#1f7a4d;
    --ok-soft:#e4f2ea;
    --warn:#b26a00;
    --warn-soft:#fdf0dc;
    --blue:#1c5b96;
    --blue-soft:#e5eef7;
    --gray-soft:#efeae3;
    --fs:19px;
    --r:16px;
    --tap:54px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
    font-size:var(--fs); line-height:1.55;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(160deg,#7a1220,#4a0c15);
    color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .h-top{display:flex;align-items:center;gap:10px}
  .h-title{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.25;flex:1}
  .h-title small{display:block;font-size:12.5px;font-weight:600;opacity:.75;letter-spacing:1.5px;margin-bottom:2px}
  .me-btn{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
    color:#fff;border-radius:999px;padding:9px 14px;font-size:16px;font-weight:700;white-space:nowrap;
  }
  .h-date{display:flex;align-items:center;gap:8px;margin-top:10px}
  .h-date button{
    background:rgba(255,255,255,.14);color:#fff;border-radius:12px;
    width:44px;height:42px;font-size:20px;font-weight:700;line-height:1;
  }
  .h-date .d-label{flex:1;text-align:center;font-size:17px;font-weight:700}
  .h-date .d-label span{opacity:.7;font-weight:600;font-size:14px}
  .conn{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;opacity:.9}
  .dot{width:9px;height:9px;border-radius:50%;background:#8bd6a5;display:inline-block;vertical-align:middle;margin-left:5px}
  .dot.off{background:#f0c14b}
  .slogan{
    margin-top:9px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
    border-radius:12px;padding:8px 9px;font-size:12.5px;font-weight:700;line-height:1.55;
    color:#f6e2c2;text-align:center;letter-spacing:-.4px;
  }
  .slogan em{font-style:normal;color:#fff;font-weight:800}

  /* ---------- page summary ---------- */
  .sum{
    background:linear-gradient(160deg,#fffdf9,#f6ecdd);border:2px solid var(--gold);
    border-radius:16px;padding:13px 15px 14px;margin-bottom:16px;
  }
  .sum-h{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
  .sum-h .ico{font-size:19px}
  .sum-h b{flex:1;font-size:16.5px;font-weight:800}
  .sum-h i{font-style:normal;font-size:13px;color:var(--ink-2);font-weight:700}
  .sum-chips{display:flex;flex-wrap:wrap;gap:7px}
  .sum-chip{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap;
  }
  .sum-chip b{font-size:17.5px;font-weight:800;color:var(--ink);margin-right:4px}
  .sum-chip.ok b{color:var(--ok)}
  .sum-chip.warn b{color:var(--warn)}
  .sum-chip.acc b{color:var(--accent)}
  .sum-chip.blue b{color:var(--blue)}
  .sum-note{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:10px;line-height:1.5}

  /* ---------- exercise ---------- */
  .ex-row{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .ex-row .lb{font-size:14.5px;font-weight:800;color:var(--ink-2)}
  .mins{width:96px;text-align:center}
  .ex-done{
    border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;
    font-size:16px;font-weight:800;color:var(--ink-2);min-height:48px;
  }
  .ex-done.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .ex-done.on::before{content:"✓ ";font-weight:900}

  /* ---------- layout ---------- */
  main{padding:14px 12px 24px;max-width:820px;margin:0 auto}
  .panel{display:none}
  .panel.on{display:block}
  .sect-h{font-size:14px;font-weight:800;color:var(--ink-2);letter-spacing:.5px;margin:22px 4px 10px;text-transform:none}
  .sect-h:first-child{margin-top:4px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(60,40,20,.05);
  }
  .card-h{display:flex;align-items:flex-start;gap:11px;padding:15px 15px 12px;border-bottom:1px solid var(--line);background:#fffdfa}
  .card-h .ico{font-size:24px;line-height:1.1}
  .card-h .tt{flex:1;min-width:0}
  .card-h .tt b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px}
  .card-h .tt span{font-size:14.5px;color:var(--ink-2);font-weight:600}
  .pill{
    font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap;
    background:var(--gray-soft);color:var(--ink-2);
  }
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .pill.chg{background:var(--warn-soft);color:var(--warn)}

  .blk{padding:14px 15px;border-bottom:1px dashed var(--line)}
  .blk:last-child{border-bottom:none}
  .blk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .blk-h b{font-size:17.5px;font-weight:800;flex:1;min-width:110px}
  .tinput{
    border:2px solid var(--line);border-radius:12px;padding:8px 10px;
    font-size:17px;font-weight:800;background:#fff;min-height:46px;
  }
  .tinput:focus{outline:none;border-color:var(--accent)}
  .del-x{background:var(--gray-soft);border-radius:10px;width:42px;height:42px;font-size:17px;color:var(--ink-2)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
  .chip{
    border:2px solid var(--line);background:#fff;border-radius:999px;
    padding:10px 15px;font-size:16.5px;font-weight:700;color:var(--ink-2);
    min-height:48px;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.on::before{content:"✓";font-weight:900}
  .note{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;
    font-size:16.5px;line-height:1.55;background:#fffdfa;resize:vertical;min-height:64px;
  }
  .note:focus{outline:none;border-color:var(--accent);background:#fff}
  .meta{font-size:13px;color:#9a9086;margin-top:8px}
  .hint{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:9px 12px;margin-top:10px;font-weight:700}

  .btn{
    display:block;width:100%;min-height:var(--tap);border-radius:14px;
    background:var(--accent);color:#fff;font-size:17px;font-weight:800;padding:14px;
  }
  .btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .btn.soft{background:var(--accent-soft);color:var(--accent)}
  .btn.small{min-height:46px;font-size:15.5px;padding:10px}
  .row2{display:flex;gap:10px}
  .row2>*{flex:1}

  /* ---------- status board ---------- */
  .my{background:linear-gradient(160deg,#fff,#fdf6ee);border:2px solid var(--gold);}
  .st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
  .st-btn{
    border:2px solid var(--line);background:#fff;border-radius:14px;
    min-height:60px;font-size:16.5px;font-weight:800;color:var(--ink-2);padding:8px 4px;
  }
  .st-btn.on{color:#fff}
  .mem-row{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px dashed var(--line)}
  .mem-row:last-child{border-bottom:none}
  .av{
    width:46px;height:46px;border-radius:14px;background:var(--gray-soft);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--ink-2);flex-shrink:0;
  }
  .mem-row .nm{flex:1;min-width:0}
  .mem-row .nm b{display:block;font-size:17px;font-weight:800}
  .mem-row .nm span{display:block;font-size:14px;color:#9a9086;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stag{font-size:14.5px;font-weight:800;padding:7px 12px;border-radius:999px;white-space:nowrap}

  /* ---------- rsvp ---------- */
  .rsvp{display:flex;gap:9px}
  .rsvp button{
    flex:1;min-height:56px;border-radius:14px;border:2px solid var(--line);
    background:#fff;font-size:17px;font-weight:800;color:var(--ink-2)
  }
  .rsvp button.on.yes{background:var(--ok);border-color:var(--ok);color:#fff}
  .rsvp button.on.no{background:#8a8078;border-color:#8a8078;color:#fff}
  .rsvp button.on.maybe{background:var(--warn);border-color:var(--warn);color:#fff}
  .rs-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .rs-t{font-size:14.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--gray-soft);color:var(--ink-2)}
  .rs-t.yes{background:var(--ok-soft);color:var(--ok)}
  .rs-t.no{background:#eceae7;color:#8a8078}
  .rs-t.maybe{background:var(--warn-soft);color:var(--warn)}

  .duty{display:flex;gap:10px;padding:12px 15px;border-bottom:1px dashed var(--line);align-items:center}
  .duty:last-child{border-bottom:none}
  .duty .lb{font-size:14px;font-weight:800;color:#fff;background:var(--accent);border-radius:8px;padding:5px 10px;white-space:nowrap}
  .duty .lb.sub{background:var(--gold)}
  .duty .lb.emg{background:#8a8078}
  .duty .vv{font-size:17px;font-weight:700}

  /* ---------- nav ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  nav button{flex:1;padding:7px 1px;border-radius:12px;color:#9a9086;font-size:10.5px;font-weight:800;letter-spacing:-.5px}
  nav button b{display:block;font-size:22px;line-height:1.25;font-weight:500}
  nav button.on{color:var(--accent);background:var(--accent-soft)}

  /* ---------- overlay ---------- */
  .ov{position:fixed;inset:0;z-index:100;background:rgba(30,20,15,.55);display:none;align-items:flex-end}
  .ov.on{display:flex}
  .sheet{
    background:var(--bg);width:100%;max-height:88vh;overflow:auto;
    border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h3{margin:0 0 4px;font-size:21px;font-weight:800}
  .sheet p.sub{margin:0 0 16px;color:var(--ink-2);font-size:15px}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .pick button{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:58px;font-size:17.5px;font-weight:800}
  .pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fam-tag{font-size:12.5px;color:#9a9086;font-weight:700;grid-column:1/-1;margin-top:6px}
  .ta-cfg{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
  code.k{background:var(--gray-soft);padding:2px 6px;border-radius:6px;font-size:14px}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);
    background:#241c17;color:#fff;padding:13px 20px;border-radius:999px;font-size:15.5px;font-weight:700;
    opacity:0;pointer-events:none;transition:.22s;z-index:200;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:#9a9086;font-size:15.5px;padding:26px 12px}
  .verse{
    background:linear-gradient(160deg,#2c1a12,#4a0c15);color:#f3e6d6;border-radius:var(--r);
    padding:16px 17px;margin-bottom:16px;font-size:16px;line-height:1.65;
  }
  .verse b{display:block;font-size:13px;letter-spacing:1px;opacity:.7;margin-bottom:6px;font-weight:800}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <div class="h-title"><small>지금은 전쟁중<i class="dot" id="cDot"></i></small>깨어 하나되자!</div>
    <button class="me-btn" id="meBtn">나 선택</button>
  </div>
  <div class="slogan">
    성경읽기 · 양식쓰기 · 처절한운동 · 철저한 대화와 소통으로<br><em>날마다 용서와 부활 승리하자!</em>
  </div>
  <div class="h-date">
    <button id="dPrev" aria-label="이전 날">‹</button>
    <div class="d-label" id="dLabel"></div>
    <button id="dNext" aria-label="다음 날">›</button>
  </div>
  <div class="conn" id="connBar" style="display:none"><span id="cTxt"></span></div>
</header>

<main>
  <section class="panel on" id="p-status"></section>
  <section class="panel" id="p-ex"></section>
  <section class="panel" id="p-today"></section>
  <section class="panel" id="p-meeting"></section>
  <section class="panel" id="p-visit"></section>
  <section class="panel" id="p-log"></section>
</main>

<nav>
  <button class="on" data-tab="status"><b>📍</b>실시간현황</button>
  <button data-tab="ex"><b>💪</b>처절한운동</button>
  <button data-tab="today"><b>🕯️</b>오늘일정</button>
  <button data-tab="meeting"><b>⛪</b>기도모임</button>
  <button data-tab="visit"><b>🏥</b>병원심방</button>
  <button data-tab="log"><b>📖</b>기록·설정</button>
</nav>

<div class="ov" id="ovLogin" style="align-items:center;background:linear-gradient(160deg,#2c1a12,#4a0c15)">
  <div style="width:100%;max-width:420px;margin:0 auto;padding:24px 22px;color:#f3e6d6;text-align:center">
    <div style="font-size:13px;letter-spacing:2px;opacity:.7;font-weight:800">지금은 전쟁중</div>
    <div style="font-size:29px;font-weight:800;margin:6px 0 26px">깨어 하나되자!</div>
    <div style="font-size:16.5px;opacity:.85;margin-bottom:14px">공동 암호를 입력해 주세요</div>
    <input id="pwIn" type="password" inputmode="text" autocomplete="current-password"
      style="width:100%;min-height:60px;border-radius:14px;border:2px solid rgba(255,255,255,.3);
             background:rgba(255,255,255,.1);color:#fff;font-size:21px;font-weight:800;
             text-align:center;padding:12px;letter-spacing:3px" placeholder="● ● ● ●" />
    <div id="pwMsg" style="min-height:24px;font-size:14.5px;color:#ffc9c9;margin:10px 0 4px"></div>
    <button id="pwGo" style="width:100%;min-height:58px;border-radius:14px;background:#fff;color:#7a1220;font-size:18px;font-weight:800">들어가기</button>
    <div style="font-size:13.5px;opacity:.6;margin-top:18px;line-height:1.6">
      한 번 입력하면 이 기기에서는 다시 묻지 않습니다.<br>암호는 담당자에게 문의하세요.
    </div>
  </div>
</div>

<div class="ov" id="ovMe"><div class="sheet">
  <h3>나는 누구인가요?</h3>
  <p class="sub">이름을 한 번만 선택하면 이 기기에 저장됩니다.</p>
  <div class="pick" id="pickList"></div>
  <button class="btn ghost" id="meClose">닫기</button>
</div></div>

<div class="ov" id="ovCfg"><div class="sheet">
  <h3>Firebase 연결 설정</h3>
  <p class="sub">Firebase 콘솔에서 복사한 <code class="k">firebaseConfig</code> 내용을 아래에 붙여넣고 저장하세요. 모든 구성원이 같은 설정을 쓰면 실시간으로 공유됩니다.</p>
  <textarea class="ta-cfg" id="cfgTa" placeholder='{&#10;  "apiKey": "AIza...",&#10;  "authDomain": "myproject.firebaseapp.com",&#10;  "databaseURL": "https://myproject-default-rtdb.firebaseio.com",&#10;  "projectId": "myproject"&#10;}'></textarea>
  <div style="height:12px"></div>
  <button class="btn" id="cfgSave">저장하고 연결하기</button>
  <div style="height:9px"></div>
  <button class="btn ghost" id="cfgClose">닫기</button>
</div></div>

<div class="toast" id="toast"></div>

<script>

/* ---------- 매일 일정 ---------- */
var SCHEDULE = [
  { id:"dawn",  ico:"🌅", title:"가정별 합심기도", time:"06:30", kind:"family",

  { id:"c16",   ico:"🕯️", title:"센터 합심기도", time:"16:00", kind:"fixed",

function $(s){return document.querySelector(s)}
function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];})}
function mem(id){for(var i=0;i<MEMBERS.length;i++) if(MEMBERS[i].id===id) return MEMBERS[i];
  return {id:id,name:id,fam:0}}
function famMembers(f){return MEMBERS.filter(function(m){return m.fam===f})}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
var DOW=["일","월","화","수","목","금","토"];
function labelDate(s){
  var d=parseYmd(s), t=ymd(new Date());
  var rel = s===t ? "오늘" : (s===ymd(new Date(Date.now()-864e5)) ? "어제" :
            (s===ymd(new Date(Date.now()+864e5)) ? "내일" : ""));
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"+(rel?' <span>· '+rel+'</span>':"");
}
function ampm(t){
  if(!t) return "";
  var p=t.split(":"), h=+p[0];
  var s = h<12?"오전":"오후"; var hh = h%12; if(hh===0) hh=12;
  return s+" "+hh+":"+p[1];
}
function ago(ts){
  if(!ts) return "";
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "방금";
  if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전";
  return Math.floor(s/86400)+"일 전";
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},1700)}

/* 경로:
   status/{memberId}        = {s, n, ts, by}
   days/{YMD}/entries/{eid} = {t, n, a:{memberId:1}, by, ts}

var SHARED_ID = "hana@war-prayer.app";   // 공동 계정 (암호만 알면 됩니다)
var DB = (function(){
  var mode="local", data={}, subs=[], ref=null, ready=false, auth=null;

  function getIn(o,path){
    var p=path.split("/"), c=o;
    for(var i=0;i<p.length;i++){ if(c==null) return null; c=c[p[i]]; }
    return c==null?null:c;
  }
  function setIn(o,path,v){
    var p=path.split("/"), c=o;
    for(var i=0;i<p.length-1;i++){ if(typeof c[p[i]]!=="object"||c[p[i]]===null) c[p[i]]={}; c=c[p[i]]; }
    if(v===null) delete c[p[p.length-1]]; else c[p[p.length-1]]=v;
  }
  function fire(){ for(var i=0;i<subs.length;i++) subs[i](); }
  function saveLocal(){ LS.set("war_local_db", JSON.stringify(data)); }

  return {
    init:function(cfg,onState){
      var raw=LS.get("war_local_db");
      if(raw){ try{ data=JSON.parse(raw)||{} }catch(e){ data={} } }
      if(!cfg){ mode="local"; ready=true; onState("local"); fire(); return; }
      mode="fb"; onState("connecting");
      var base="https://www.gstatic.com/firebasejs/10.12.5/";
      loadScript(base+"firebase-app-compat.js",function(ok){
        if(!ok) return fail();
        loadScript(base+"firebase-database-compat.js",function(ok2){
          if(!ok2) return fail();
          loadScript(base+"firebase-auth-compat.js",function(hasAuth){
            if(!hasAuth) return fail();
            try{
              firebase.initializeApp(cfg);
              var attached=false;
              function attach(){
                if(attached) return; attached=true;
                ref=firebase.database().ref("rooms/"+ROOM);
                ref.on("value",function(snap){ data=snap.val()||{}; ready=true; onState("online"); fire(); },
                  function(){ onState("denied") });
              }
              auth=firebase.auth();
              auth.onAuthStateChanged(function(u){
                if(u){ onState("auth"); attach(); }
                else onState("login");
              });
            }catch(e){ fail() }
          });
        });
      });
      function fail(){ mode="local"; ready=true; onState("failed"); fire(); }
      function loadScript(src,cb){
        var s=document.createElement("script"); s.src=src;
        s.onload=function(){cb(true)}; s.onerror=function(){cb(false)};
        document.head.appendChild(s);
      }
    },
    mode:function(){return mode},
    login:function(pw,cb){
      if(!auth) return cb("연결이 아직 준비되지 않았습니다. 잠시 후 다시 시도해 주세요.");
      auth.signInWithEmailAndPassword(SHARED_ID,pw)
        .then(function(){ cb(null) })
        .catch(function(e){
          var c=e&&e.code||"";
          if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0) cb("암호가 맞지 않습니다.");
          else if(c.indexOf("too-many-requests")>=0) cb("시도가 너무 많습니다. 잠시 후 다시 해주세요.");
          else if(c.indexOf("network")>=0) cb("인터넷 연결을 확인해 주세요.");
          else cb("들어갈 수 없습니다. ("+c+")");
        });
    },
    logout:function(){ if(auth) auth.signOut() },
    get:function(path){ return getIn(data,path) },
    all:function(){ return data },
    set:function(path,v){
      setIn(data,path,v);
      if(mode==="fb"&&ref){ try{ ref.child(path).set(v) }catch(e){} } else saveLocal();
      fire();
    },
    onChange:function(fn){ subs.push(fn) }
  };
})();

    b.addEventListener("click",function(){
      var cur=entry(opts.date,opts.eid), a=cur.a||{};
      if(a[mid]) delete a[mid]; else a[mid]=1;
      saveEntry(opts.date,opts.eid,{a:a, t:(cur.t||opts.defTime)});
      render();
    });
    cw.appendChild(b);

  wrap.appendChild(cw);

  var ta=el("textarea","note");
  ta.placeholder=opts.ph||"기도 내용 · 나눔 · 응답을 기록하세요";
  ta.value=e.n||"";

  ta.addEventListener("input",function(){
    clearTimeout(tm);
    tm=setTimeout(function(){ saveEntry(opts.date,opts.eid,{n:ta.value, t:(entry(opts.date,opts.eid).t||opts.defTime)}); },900);
  });
  ta.addEventListener("blur",function(){
    clearTimeout(tm);
    saveEntry(opts.date,opts.eid,{n:ta.value, t:(entry(opts.date,opts.eid).t||opts.defTime)});
  });

  return wrap;
}

function renderToday(){
  var p=$("#p-today"); p.innerHTML="";
  var date=S.date, dow=parseYmd(date).getDay();

  var totalDone=0,totalBlk=0;
  var items=SCHEDULE.filter(function(s){ return !s.days || s.days.indexOf(dow)>=0 });
  items.sort(function(a,b){ return a.time<b.time?-1:1 });

  /* --- 상단 요약 (먼저 계산) --- */
  var gDone=0,gBlk=0,nextTxt="",nextFound=false;
  items.forEach(function(s){
    var d=0,b=0;
    if(s.kind==="family"){ b=FAMILIES.length;
      FAMILIES.forEach(function(f){ if(attCount(entry(date,s.id+"__f"+f.id))>0) d++ }); }
    else if(s.kind==="pairs"){ var ps=pairList(date); b=Math.max(1,ps.length);
      ps.forEach(function(k){ if(attCount(entry(date,k))>0) d++ }); }
    else { b=1; if(attCount(entry(date,s.id))>0) d=1 }
    gDone+=d; gBlk+=b;
    if(!nextFound && d<b){
      var t=entry(date,s.kind==="fixed"||s.kind==="all"?s.id:s.id).t||s.time;
      if(date!==ymd(new Date()) || toMin(t)>=nowMin()-30){ nextTxt=ampm(t)+" "+s.title; nextFound=true }
    }
  });
  var isToday=(date===ymd(new Date()));
  p.appendChild(sumCard("🕯️","오늘의 기도 진행", isToday?"오늘":labelDate(date).replace(/<[^>]+>/g,""),[
    {k:"모임 기록", v:gDone+"/"+gBlk, tone:(gDone>=gBlk?"ok":"acc")},
    {k:"남은 모임", v:Math.max(0,gBlk-gDone), tone:(gBlk-gDone>0?"warn":"ok")}
  ], nextTxt? "다음 ▸ "+nextTxt : "오늘 예정된 모임을 모두 기록했습니다. 🙏"));

  items.forEach(function(s){
    var card=el("div","card");
    var ch=el("div","card-h");
    ch.appendChild(el("div","ico",s.ico));
    var tt=el("div","tt");
    tt.appendChild(el("b",null,esc(s.title)));
    var sub=(s.span?s.span:ampm(s.time))+(s.place?" · "+s.place:"")+(s.desc?" · "+s.desc:"")+(s.leader?" · "+s.leader:"");
    tt.appendChild(el("span",null,esc(sub)));
    ch.appendChild(tt);

    // 완료 상태 뱃지
    var doneN=0,blkN=0;
    if(s.kind==="family"){ blkN=FAMILIES.length;
      FAMILIES.forEach(function(f){ if(attCount(entry(date,s.id+"__f"+f.id))>0) doneN++ }); }
    else if(s.kind==="pairs"){ var ps=pairList(date); blkN=Math.max(1,ps.length);
      ps.forEach(function(k){ if(attCount(entry(date,k))>0) doneN++ }); }
    else { blkN=1; if(attCount(entry(date,s.id))>0) doneN=1 }
    totalDone+=doneN; totalBlk+=blkN;
    ch.appendChild(el("span","pill"+(doneN>=blkN&&blkN>0?" done":""),doneN+"/"+blkN));
    card.appendChild(ch);

    if(s.kind==="family"){
      FAMILIES.forEach(function(f){
        card.appendChild(blockEl({date:date,eid:s.id+"__f"+f.id,label:f.name,
          members:famMembers(f.id).map(function(m){return m.id}),defTime:s.time}));
      });
    } else if(s.kind==="pairs"){
      var list=pairList(date);
      if(!list.length) card.appendChild(el("div","empty","오늘의 전화 합심기도 기록이 아직 없습니다.<br>아래 버튼으로 추가하세요."));
      list.forEach(function(eid,i){
        card.appendChild(blockEl({date:date,eid:eid,label:(i+1)+"팀",
          members:MEMBERS.map(function(m){return m.id}),defTime:s.time,
          ph:"통화 기도 제목 · 나눈 내용",
          onDelete:function(){ DB.set("days/"+date+"/entries/"+eid,null); render(); }}));
      });
      var addWrap=el("div","blk");
      var add=el("button","btn soft small","＋ 전화 합심기도 팀 추가");
      add.addEventListener("click",function(){
        saveEntry(date,"call__"+uid(),{t:s.time,a:{},n:""}); render();
      });
      addWrap.appendChild(add); card.appendChild(addWrap);
    } else {
      var b=blockEl({date:date,eid:s.id,label:s.title,
        members:(s.kind==="all")?MEMBERS.map(function(m){return m.id}):s.members,
        defTime:s.time});
      if(s.alt) b.appendChild(el("div","meta","기본 "+s.alt.map(ampm).join(" 또는 ")+" · 사정에 따라 시간을 바꾸면 자동으로 모두에게 표시됩니다"));
      if(s.warn) b.appendChild(el("div","hint","⚠ "+esc(s.warn)));

        rz.appendChild(el("b",null,"참석 여부"));
        rz.appendChild(rsvpEl(date,s.id));

  });

function dayReport(date){
  var dow=parseYmd(date).getDay();
  var L=[], d=parseYmd(date);
  L.push("【지금은 전쟁중 — 깨어 하나되자!】");
  L.push((d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[dow]+") 기도 기록");
  L.push("");
  SCHEDULE.filter(function(s){return !s.days||s.days.indexOf(dow)>=0})
    .sort(function(a,b){return a.time<b.time?-1:1}).forEach(function(s){
    var lines=[];
    function push(label,eid,defT){
      var e=entry(date,eid); var n=attCount(e);
      if(!n && !(e.n||"").trim()) return;
      lines.push("  · "+label+" "+ampm(e.t||defT)+" | "+(n?attNames(e).join(", "):"참석 미기록")+
        ((e.n||"").trim()?"\n    ↳ "+e.n.trim().replace(/\n/g,"\n      "):""));
    }
    if(s.kind==="family") FAMILIES.forEach(function(f){ push(f.name,s.id+"__f"+f.id,s.time) });
    else if(s.kind==="pairs") pairList(date).forEach(function(k,i){ push((i+1)+"팀",k,s.time) });
    else push("모임",s.id,s.time);
    if(lines.length){ L.push("▶ "+s.title+" ("+ampm(s.time)+")"); L.push(lines.join("\n")); L.push(""); }
  });
  var exL=[];
  MEMBERS.forEach(function(m){
    var e=exGet(date,m.id);
    if(e.done||(e.n||"").trim()||e.m)
      exL.push("  · "+m.name+(e.t?" "+ampm(e.t):"")+(e.m?" "+e.m+"분":"")+(e.done?" ✔":"")+
        ((e.n||"").trim()?" | "+e.n.trim():""));
  });
  if(exL.length){ L.push("▶ 처절한 운동"); L.push(exL.join("\n")); L.push("") }

  var vs=DB.get("visits/"+date)||{};
  var vk=Object.keys(vs);
  if(vk.length){
    L.push("▶ 병원 심방");
    vk.forEach(function(k){
      var v=vs[k], nm=[]; for(var i in (v.a||{})) if(v.a[i]) nm.push(mem(i).name);
      L.push("  · "+ampm(v.t)+" | "+(nm.join(", ")||"참석 미기록")+((v.n||"").trim()?"\n    ↳ "+v.n.trim():""));
    });
    L.push("");
  }
  L.push("― 깨어 기도하는 하나된 공동체 ―");
  return L.join("\n");
}

  help.appendChild(el("div","card-h",'<div class="ico">💡</div><div class="tt"><b>사용 안내</b></div>'));
  help.appendChild(el("div","blk",
    "<div style='font-size:16px;line-height:1.75'>"+
    "① <b>오늘 일정</b> — 기도가 끝나면 참석자 이름을 눌러 체크하고 내용을 적습니다.<br>"+
    "② 사정상 시간이 바뀌면 <b>시간칸을 직접 수정</b>하세요. 모두에게 '시간 변경'으로 보입니다.<br>"+
    "③ <b>실시간 현황</b> — 출근 전/근무 중/퇴근/운동 중/이동 중을 누르고, 필요하면 자유롭게 상황을 적습니다.<br>"+
    "④ <b>기도모임</b> — 수·토 전체 합심기도의 참석 여부를 미리 표시합니다.<br>"+
    "⑤ <b>병원 심방</b> — 담당자가 주말 심방 시간과 참석자를 기록합니다.<br>"+
    "⑥ <b>기록</b> — 하루 기록을 한 번에 복사해 단톡방에 올릴 수 있습니다."+
    "</div>"));
  p.appendChild(help);
}

/* ====================== 렌더 ====================== */
function render(){
  var a=document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="date"))){ pendingRender=true; return }
  pendingRender=false;
  $("#dLabel").innerHTML=labelDate(S.date);
  $("#meBtn").textContent=S.me?mem(S.me).name:"나 선택";
  document.querySelectorAll("nav button").forEach(function(b){
    b.classList.toggle("on",b.dataset.tab===S.tab)});
  document.querySelectorAll(".panel").forEach(function(x){x.classList.remove("on")});
  $("#p-"+S.tab).classList.add("on");
  if(S.tab==="today") renderToday();
  else if(S.tab==="ex") renderExercise();
  else if(S.tab==="status") renderStatus();
  else if(S.tab==="meeting") renderMeeting();
  else if(S.tab==="visit") renderVisit();
  else renderLog();
}
/* 입력 도중 화면이 다시 그려져 글자가 사라지지 않도록, 약간 늦춰서 다시 그립니다 */
var _rt=null;
function scheduleRender(){ clearTimeout(_rt); _rt=setTimeout(render,140) }
document.addEventListener("focusout",function(){
  setTimeout(function(){ if(pendingRender) render() },300);
});

/* ====================== 이벤트 ====================== */
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){ S.tab=b.dataset.tab; window.scrollTo(0,0); render() });
});
$("#dPrev").addEventListener("click",function(){
  var d=parseYmd(S.date); d.setDate(d.getDate()-1); S.date=ymd(d); render();
});
$("#dNext").addEventListener("click",function(){
  var d=parseYmd(S.date); d.setDate(d.getDate()+1); S.date=ymd(d); render();
});
function openMe(){
  var w=$("#pickList"); w.innerHTML="";
  FAMILIES.forEach(function(f){
    w.appendChild(el("div","fam-tag",f.name));
    famMembers(f.id).forEach(function(m){
      var b=el("button",S.me===m.id?"on":"",esc(m.name));
      b.addEventListener("click",function(){
        S.me=m.id; LS.set("war_me",m.id); $("#ovMe").classList.remove("on");
        toast(m.name+"님, 함께 기도합니다"); render();
      });
      w.appendChild(b);
    });
  });
  $("#ovMe").classList.add("on");
}
$("#meBtn").addEventListener("click",openMe);
$("#meClose").addEventListener("click",function(){$("#ovMe").classList.remove("on")});
$("#cfgClose").addEventListener("click",function(){$("#ovCfg").classList.remove("on")});
$("#cfgSave").addEventListener("click",function(){
  var t=$("#cfgTa").value.trim();
  if(!t){ toast("설정 내용을 붙여넣어 주세요"); return }
  try{
    var m=t.match(/\{[\s\S]*\}/); var obj=null;
    try{ obj=JSON.parse(m?m[0]:t) }catch(e){ obj=(new Function("return ("+(m?m[0]:t)+")"))() }
    if(!obj || !obj.apiKey){ toast("apiKey가 보이지 않습니다"); return }
    LS.set("war_cfg",JSON.stringify(obj));
    toast("저장했습니다. 다시 시작합니다…");
    setTimeout(function(){ location.reload() },900);
  }catch(e){ toast("형식을 확인해 주세요") }
});
$("#ovMe").addEventListener("click",function(e){ if(e.target.id==="ovMe") $("#ovMe").classList.remove("on") });
$("#ovCfg").addEventListener("click",function(e){ if(e.target.id==="ovCfg") $("#ovCfg").classList.remove("on") });

/* ====================== 시작 ====================== */
(function start(){
  var cfg=FIREBASE_CONFIG;
  if(!cfg){ var raw=LS.get("war_cfg"); if(raw){ try{ cfg=JSON.parse(raw) }catch(e){} } }
  if(cfg){ try{ $("#cfgTa").value=JSON.stringify(cfg,null,2) }catch(e){} }
  var authed=false;
  DB.onChange(function(){ scheduleRender() });
  DB.init(cfg,function(state){
    var dot=$("#cDot"), txt=$("#cTxt"), bar=$("#connBar");
    bar.style.display = (state==="online") ? "none" : "flex";
    if(state==="online"){
      dot.classList.remove("off"); txt.textContent="실시간 공유 연결됨";
      $("#ovLogin").classList.remove("on");
      if(!authed){ authed=true; if(!S.me) setTimeout(openMe,400) }
    }
    else if(state==="auth"){ dot.classList.add("off"); txt.textContent="기록을 불러오는 중…" }
    else if(state==="login"){
      dot.classList.add("off"); txt.textContent="공동 암호 입력이 필요합니다";
      $("#ovLogin").classList.add("on"); setTimeout(function(){ try{$("#pwIn").focus()}catch(e){} },200);
    }
    else if(state==="denied"){ dot.classList.add("off"); txt.textContent="읽기 권한이 없습니다 — 담당자에게 문의하세요" }
    else if(state==="connecting"){ dot.classList.add("off"); txt.textContent="연결하는 중…" }
    else if(state==="failed"){ dot.classList.add("off"); txt.textContent="연결 실패 — 이 기기에만 저장됩니다" }
    else { dot.classList.add("off"); txt.textContent="체험 모드 · 이 기기에만 저장 (설정에서 실시간 공유 켜기)" }
  });
  function doLogin(){
    var pw=$("#pwIn").value.trim();
    if(!pw){ $("#pwMsg").textContent="암호를 입력해 주세요."; return }
    $("#pwMsg").style.color="#ffe9b0"; $("#pwMsg").textContent="확인 중…";
    DB.login(pw,function(err){
      if(err){ $("#pwMsg").style.color="#ffc9c9"; $("#pwMsg").textContent=err; }
      else { $("#pwMsg").textContent=""; $("#pwIn").value=""; }
    });
  }
  $("#pwGo").addEventListener("click",doLogin);
  $("#pwIn").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin() });
  render();
  setInterval(function(){ if(S.tab==="status") render() },60000);
  setInterval(function(){
    var t=ymd(new Date());
    if(S.date!==t && S.date===ymd(new Date(Date.now()-864e5))){ /* 자정 지나도 사용자 선택 유지 */ }
  },60000);
  if(!cfg && !S.me) setTimeout(openMe,500);
})();
</script>
</body>
</html>
